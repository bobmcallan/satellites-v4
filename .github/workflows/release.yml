name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: satellites

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          go build ./cmd/satellites-server/
          go build ./cmd/satellites-agent/
          go build ./cmd/satellites-client/

      - name: Vet
        run: go vet ./...

      # Tests are run locally before pushing — keeping CI to compile + vet
      # so the release workflow stays focused on producing a deployable
      # image. Re-enable here if/when a hosted SurrealDB is wired into CI.

  push:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=$(awk '/^\[satellites\]/{f=1;next} /^\[/{f=0} f && /^version/{gsub(/version\s*=\s*/,""); gsub(/ /,""); print; exit}' .version)
          {
            echo "version=${VERSION}"
            echo "build=$(date -u +%Y%m%d%H%M%S)"
            echo "commit=${GITHUB_SHA::8}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD=${{ steps.meta.outputs.build }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
          provenance: false
          sbom: false

      - name: Push image
        env:
          TAGS: ${{ steps.docker-meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::Pushing $tag"
            docker push "$tag"
            echo "::endgroup::"
          done <<< "$TAGS"

  deploy:
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-satellites
      cancel-in-progress: false

    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}:latest
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}:latest registry.fly.io/satellites-pprod:latest
          docker push registry.fly.io/satellites-pprod:latest

      - name: Pre-deploy machine check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          stuck=$(flyctl machines list --app satellites-pprod --json \
            | jq '[.[] | select(.state == "replacing" or .state == "destroying")] | length')
          if [ "$stuck" -gt 0 ]; then
            echo "::warning::Found $stuck stuck machine(s) — forcing cleanup"
            flyctl machines list --app satellites-pprod --json \
              | jq -r '.[] | select(.state == "replacing" or .state == "destroying") | .id' \
              | xargs -I{} flyctl machines destroy {} --app satellites-pprod --force
            sleep 5
          fi

      - name: Deploy to Fly.io
        uses: nick-fields/retry@v3
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            flyctl deploy \
              --app satellites-pprod \
              --image registry.fly.io/satellites-pprod:latest \
              --strategy rolling \
              --wait-timeout 300 \
              --yes

  # client-release publishes satellites-client linux binaries + a
  # manifest.json onto a GitHub Release whenever a v* tag is pushed.
  # The drift check baked into the binary (sty_64e69db8) fetches
  # this manifest on boot to detect when an operator is running a
  # stale version. Tag-gated; branch pushes do not fire this job.
  client-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Extract client version metadata
        id: meta
        run: |
          VERSION=$(awk '
            BEGIN { in_section = 0 }
            /^[[:space:]]*\[.*\][[:space:]]*$/ {
              header = $0
              sub(/^[[:space:]]*\[/, "", header)
              sub(/\][[:space:]]*$/, "", header)
              in_section = (header == "satellites-client")
              next
            }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/^[[:space:]]*version[[:space:]]*=[[:space:]]*/, "", $0)
              gsub(/[[:space:]]+$/, "", $0)
              print
              exit
            }
          ' .version)
          BUILD=$(date -u +%Y-%m-%d-%H-%M-%S)
          COMMIT=${GITHUB_SHA::8}
          {
            echo "version=${VERSION}"
            echo "build=${BUILD}"
            echo "commit=${COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64 + linux/arm64
        run: |
          set -euo pipefail
          MOD=$(go list -m)
          LDFLAGS="-X ${MOD}/internal/config.Version=${{ steps.meta.outputs.version }} -X ${MOD}/internal/config.Build=${{ steps.meta.outputs.build }} -X ${MOD}/internal/config.GitCommit=${{ steps.meta.outputs.commit }}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/satellites-client-linux-amd64 ./cmd/satellites-client
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/satellites-client-linux-arm64 ./cmd/satellites-client

      - name: Compute sha256 + emit manifest.json
        id: manifest
        run: |
          set -euo pipefail
          cd dist
          AMD64_SHA=$(sha256sum satellites-client-linux-amd64 | awk '{print $1}')
          ARM64_SHA=$(sha256sum satellites-client-linux-arm64 | awk '{print $1}')
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > manifest.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "build": "${{ steps.meta.outputs.build }}",
            "commit": "${{ steps.meta.outputs.commit }}",
            "artifacts": [
              {
                "os": "linux",
                "arch": "amd64",
                "filename": "satellites-client-linux-amd64",
                "sha256": "${AMD64_SHA}",
                "download_url": "${BASE}/satellites-client-linux-amd64"
              },
              {
                "os": "linux",
                "arch": "arm64",
                "filename": "satellites-client-linux-arm64",
                "sha256": "${ARM64_SHA}",
                "download_url": "${BASE}/satellites-client-linux-arm64"
              }
            ]
          }
          EOF
          cat manifest.json

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/satellites-client-linux-amd64
            dist/satellites-client-linux-arm64
            dist/manifest.json
          fail_on_unmatched_files: true
